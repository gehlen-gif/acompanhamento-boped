   ['Com pedido pendente',int(rows.filter(g=>g.pend>0).length),brl(rows.reduce((s,g)=>s+g.pend,0))]];
  if(IND)kp.splice(1,0,['Da minha carteira',int(rows.filter(g=>g.v===IND.v||g.vs.includes(IND.v)).length),'grupos que eu atendo hoje']);
  $('#kpis').innerHTML=kp.map(([l,v,s])=>`<div class="kpi"><span class="note">${l}</span><span class="v">${v}</span><span class="s">${s}</span></div>`).join('');
  bars('b-uf',filt('uf'),'uf',15);bars('b-v',filt('v'),'v',15);
  const k=ord.k,dir=ord.dir;
  const val=g=>k==='loc'?g.cid+g.uf:g[k];
  rows.sort((a,b)=>{const x=val(a),y=val(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'pt-BR'))*dir});
  document.querySelectorAll('#hd th').forEach(th=>th.className=(th.className.includes('n')?'n ':'')+(th.dataset.k===k?(dir<0?'desc':'asc'):''));
  $('#tt').textContent=`Grupos de clientes (${int(rows.length)})`;
  const pill=(t,c)=>`<span class="pill ${c}">${t}</span>`;
  $('#tb').innerHTML=rows.slice(0,lim).map(g=>{
    const mine=IND&&(g.v===IND.v||g.vs.includes(IND.v));
    let h=`<tr class="g ${mine?'mine':''}"><td><b>${esc(g.g)}</b><br><span class="m">Cód. grupo ${esc(g.cg)}${g.cl.length?` · ${g.cl.length} clientes <button class="tog" data-cg="${esc(g.cg)}">${openRows.has(g.cg)?'ocultar':'ver'}</button>`:''}</span></td>
<td>${g.s==='Inativo'?pill('Inativo','bad'):pill('A inativar','warn')}${g.inat?`<br><span class="m">desde ${fd(g.inat)}</span>`:''}</td>
<td>${esc(g.cid)} / ${esc(g.uf)}</td>
<td>${g.tel?`<a href="tel:+55${g.tel.replace(/\D/g,'')}">${esc(g.tel)}</a>`:'—'}${g.em?`<br><span class="m em">${esc(g.em)}</span>`:''}</td>
<td>${esc(g.seg)}</td>
<td>${g.inad==='Sim'?pill('Sim','bad'):pill('Não','ok')}</td>
<td class="n">${g.venc?brl2(g.venc):'—'}</td>
<td>${fd(g.ult)}${g.ped?`<br><span class="m">pedido aberto ${fd(g.ped)}</span>`:''}</td>
<td class="n">${g.d==null?'—':int(g.d)}</td>
<td class="n">${brl2(g.fat)}</td>
<td class="n">${g.pend?brl2(g.pend):'—'}</td>
<td>${esc(g.v)}${g.vs.length?`<br><span class="m">também: ${esc(g.vs.join(', '))}</span>`:''}</td></tr>`;
    if(openRows.has(g.cg))h+=g.cl.map(c=>`<tr class="sub"><td>${esc(c.n)}<br><span class="m">Cód. ${esc(c.c)}</span></td><td></td><td>${esc(c.cid)} / ${esc(c.uf)}</td><td>${esc(c.tel)||'—'}</td><td></td><td></td><td class="n">${c.venc?brl2(c.venc):'—'}</td><td>${fd(c.ult)}</td><td></td><td class="n">${brl2(c.fat)}</td><td></td><td>${esc(c.v)}</td></tr>`).join('');
    return h}).join('')||`<tr><td colspan="12" class="note">Nenhum grupo no filtro.</td></tr>`;
  $('#mais').innerHTML=rows.length>lim?`<button id="vm">Mostrar mais (${int(rows.length-lim)} restantes)</button>`:'';
  if(rows.length>lim)$('#vm').onclick=()=>{lim+=300;draw()};
  window._rows=rows;
}
$('#tb').addEventListener('click',e=>{const b=e.target.closest('.tog');if(!b)return;const c=b.dataset.cg;openRows.has(c)?openRows.delete(c):openRows.add(c);draw()});
$('#csv').addEventListener('click',()=>{
  const h=['Cód Grupo','Grupo de Cliente','Situação','Data Inativação','Cidade','UF','Telefone','E-mail','Segmento','Inadimplente','Valor Vencido','Último Pedido','Dias sem comprar','Faturado','Pedidos Pendentes','Atendido por','Time','Outros vendedores no grupo','Clientes no grupo'];
  const q=v=>{v=v==null?'':String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const nb=v=>v.toFixed(2).replace('.',',');
  const lines=[h.join(';')].concat(window._rows.map(g=>[g.cg,g.g,g.s,fd(g.inat),g.cid,g.uf,g.tel,g.em,g.seg,g.inad,nb(g.venc),fd(g.ult),g.d??'',nb(g.fat),nb(g.pend),g.v,g.t,g.vs.join(', '),Math.max(1,g.cl.length)].map(q).join(';')));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv'}));
  a.download=(document.title.replace(/[^\w]+/g,'_'))+'_'+META.ref+'.csv';a.click();
});
draw();
})();
</script></body></html>
