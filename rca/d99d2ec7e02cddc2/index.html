async function abrir(senha,auto){
  const e=document.getElementById('e');e.textContent='Abrindo...';
  try{
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(senha.trim().toLowerCase()),'PBKDF2',false,['deriveKey']);
